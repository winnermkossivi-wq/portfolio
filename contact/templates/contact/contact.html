{% extends 'base.html' %}

{% block title %}Contact — Mon Portfolio{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-4 py-20">
    <div class="reveal">
        <h1 class="text-4xl font-extrabold text-black tracking-tight">Contactez-moi</h1>
        <p class="mt-3 text-gray-600">Une question, un projet ? Écrivez-moi via ce formulaire.</p>
    </div>

    <form method="post" class="reveal mt-10 space-y-6 bg-white border border-gray-200 shadow-sm rounded-2xl p-8">
        {% csrf_token %}
        <div>
            <label for="id_nom" class="block text-sm font-medium text-gray-800 mb-2">Nom</label>
            <input type="text" id="id_nom" name="nom" required
                   class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-black placeholder-gray-400 focus:outline-none focus:border-black transition"
                   placeholder="Votre nom">
        </div>
        <div>
            <label for="id_email" class="block text-sm font-medium text-gray-800 mb-2">Email</label>
            <input type="email" id="id_email" name="email" required
                   class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-black placeholder-gray-400 focus:outline-none focus:border-black transition"
                   placeholder="vous@exemple.com">
        </div>
        <div>
            <label for="id_sujet" class="block text-sm font-medium text-gray-800 mb-2">Sujet <span class="text-gray-500">(optionnel)</span></label>
            <input type="text" id="id_sujet" name="sujet"
                   class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-black placeholder-gray-400 focus:outline-none focus:border-black transition"
                   placeholder="Le sujet de votre message">
        </div>
        <div>
            <label for="id_contenu" class="block text-sm font-medium text-gray-800 mb-2">Votre message</label>
            <textarea id="id_contenu" name="contenu" rows="6" required
                      class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-black placeholder-gray-400 focus:outline-none focus:border-black transition resize-y"
                      placeholder="Votre message..."></textarea>
        </div>
        <button type="submit"
                class="w-full bg-black text-white font-semibold px-6 py-3 rounded-full hover:bg-gray-700 transition">
            Envoyer le message
        </button>
    </form>
</section>
{% endblock %}
