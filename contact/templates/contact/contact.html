{% extends 'base.html' %}

{% block title %}Contact — Mon Portfolio{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-4 py-20">
    <div class="reveal">
        <h1 class="text-4xl font-extrabold text-base-content tracking-tight">Contactez-moi</h1>
        <p class="mt-3 text-base-content/60">Une question, un projet ? Écrivez-moi via ce formulaire.</p>
    </div>

    <form method="post" class="reveal mt-10 space-y-6 bg-base-300 border border-base-content/10 shadow-sm rounded-2xl p-8">
        {% csrf_token %}
        <fieldset class="fieldset">
            <legend class="fieldset-legend">Nom</legend>
            <input type="text" id="id_nom" name="nom" required class="input w-full" placeholder="Votre nom">
        </fieldset>
        <fieldset class="fieldset">
            <legend class="fieldset-legend">Email</legend>
            <input type="email" id="id_email" name="email" required class="input w-full" placeholder="vous@exemple.com">
        </fieldset>
        <fieldset class="fieldset">
            <legend class="fieldset-legend">Sujet</legend>
            <input type="text" id="id_sujet" name="sujet" class="input w-full" placeholder="Le sujet de votre message">
            <p class="label">Optionnel</p>
        </fieldset>
        <fieldset class="fieldset">
            <legend class="fieldset-legend">Votre message</legend>
            <textarea id="id_contenu" name="contenu" rows="6" required class="textarea w-full resize-y" placeholder="Votre message..."></textarea>
        </fieldset>
        <button type="submit" class="btn btn-primary w-full">
            Envoyer le message
        </button>
    </form>
</section>
{% endblock %}
